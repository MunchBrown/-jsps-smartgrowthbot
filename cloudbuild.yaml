# Cloud Build: build the Docker image and deploy it to Cloud Run.
# Used by the Cloud Build trigger on pushes to the deploy branch.
# (The image name is fixed here because the GitHub repo name starts with a
# hyphen, which Docker does not allow in image names.)
substitutions:
  _REGION: us-east1
  _SERVICE: smartgrowthbot-app
  _IMAGE: us-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/smartgrowthbot/smartgrowthbot-app

steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${COMMIT_SHA}", "-t", "${_IMAGE}:latest", "."]

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    # Keeps the service's existing settings (environment variables, scaling).
    args: ["run", "deploy", "${_SERVICE}", "--image", "${_IMAGE}:${COMMIT_SHA}", "--region", "${_REGION}", "--quiet"]

images:
  - "${_IMAGE}:${COMMIT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
  # The trigger may pass extra substitutions left from the console setup.
  substitutionOption: ALLOW_LOOSE
